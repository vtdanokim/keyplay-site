<h1>KeyPlay</h1>
<p>Pick a photo, shake your phone, and jingle the keys. KeyPlay plays a keys-jingling sound every time you shake, and it works even when your phone is on silent.</p>
<p>KeyPlay collects no data. <a href="privacy.html">Read the privacy policy</a>. Need help? <a href="support.html">Visit support</a>.</p>
